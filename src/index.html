<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Israeli Whist Scorekeeper</title>
  
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Whist Score">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.min.css?v=9">
  <link rel="preload" href="js/app.bundle.js?v=9" as="script" crossorigin>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♠</text></svg>">
</head>
<body>

  <!-- Top Mobile Bar (Compact Zero Clutter) -->
  <header class="navbar">
    <div class="nav-left">
      <div class="brand-indicator" id="sync-indicator" title="Connected"></div>
      <span class="brand-name" id="btn-brand-home" title="Tap to return to Lobby" style="cursor: pointer;">Whist</span>
      <button class="room-pill" id="btn-room-badge" title="Tap to Share">
        <span id="room-code-display">W-...</span>
      </button>
    </div>

    <div class="nav-right">
      <button class="btn-pill btn-lang" id="btn-lang-toggle" title="Switch Language / החלף שפה">עב</button>
      <button class="btn-pill btn-share" id="btn-open-share">Share</button>
      <button class="btn-pill btn-menu" id="btn-open-menu">Menu ☰</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    
    <!-- Landing / Welcome Lobby View -->
    <section id="landing-view-container"></section>

    <!-- Active Game View -->
    <section id="game-view-container" style="display: none;">
      <!-- Top Leaderboard -->
      <section id="leaderboard-section"></section>

      <!-- Tabs -->
      <nav class="tabs">
        <button class="tab-item active" data-tab="tab-round" id="tab-btn-round">Active Deal</button>
        <button class="tab-item" data-tab="tab-history" id="tab-btn-history">History</button>
        <button class="tab-item" data-tab="tab-chart" id="tab-btn-chart">Chart</button>
      </nav>

      <!-- Tab Panels -->
      <div id="tab-round" class="tab-panel active">
        <div id="round-view-container"></div>
      </div>

      <div id="tab-history" class="tab-panel" style="display: none;">
        <div id="history-view-container"></div>
      </div>

      <div id="tab-chart" class="tab-panel" style="display: none;">
        <div id="chart-view-container"></div>
      </div>
    </section>

  </main>

  <script type="module" src="js/app.bundle.js?v=9"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (const reg of regs) reg.unregister();
      }).catch(() => {});
    }
  </script>
</body>
</html>
