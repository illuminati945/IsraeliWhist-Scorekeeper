<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Israeli Whist Scorekeeper</title>
  
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Whist Score">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♠</text></svg>">
</head>
<body>

  <!-- Sleek Top Navbar -->
  <header class="navbar">
    <div class="brand">
      <div class="brand-dot" id="sync-indicator" title="Live Sync Active"></div>
      <span class="brand-title">Whist Scorekeeper</span>
      <button class="btn-nav" id="btn-room-badge" style="margin-left: 4px; padding: 2px 7px; font-size: 0.75rem; background: rgba(99, 102, 241, 0.15); border-color: rgba(99, 102, 241, 0.3); color: #c7d2fe;">
        <span id="room-code-display">Room: ...</span>
        <span id="user-count-display" style="opacity: 0.8; margin-left: 3px;">(1)</span>
      </button>
    </div>

    <div class="nav-actions">
      <button class="btn-nav btn-nav-primary" id="btn-open-share" style="background: #2563eb; border-color: #2563eb;">Share Link</button>
      <button class="btn-nav" id="btn-open-rules">Rules</button>
      <button class="btn-nav" id="btn-open-stats">Stats</button>
      <button class="btn-nav btn-nav-primary" id="btn-open-new-game">New Game</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    
    <!-- Top Leaderboard -->
    <section id="leaderboard-section"></section>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab-item active" data-tab="tab-round" id="tab-btn-round">Active Round</button>
      <button class="tab-item" data-tab="tab-history" id="tab-btn-history">History</button>
      <button class="tab-item" data-tab="tab-chart" id="tab-btn-chart">Progression</button>
    </nav>

    <!-- Tab Panels -->
    <div id="tab-round" class="tab-panel active">
      <div id="round-view-container"></div>
    </div>

    <div id="tab-history" class="tab-panel" style="display: none;">
      <div id="history-view-container"></div>
    </div>

    <div id="tab-chart" class="tab-panel" style="display: none;">
      <div id="chart-view-container"></div>
    </div>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
